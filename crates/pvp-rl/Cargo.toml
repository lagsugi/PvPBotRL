[package]
name = "pvp-rl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pvp-rl-eval"
path = "src/eval.rs"

[dependencies]
pvp-policy = { path = "../pvp-policy" }
pvp-sim = { path = "../pvp-sim" }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
