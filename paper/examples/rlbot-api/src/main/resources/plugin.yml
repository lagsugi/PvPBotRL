name: PvPBotRLExample
version: '1.0.0'
main: dev.sugi.pvpbot.example.ExamplePlugin
api-version: '26.1.2'
depend: [PvPBotRL]
commands:
  rlbotexample:
    description: Play, host, or spectate sword duels.
    usage: /rlbotexample help
    permission: pvpbotrlexample.demo
permissions:
  pvpbotrlexample.demo:
    default: true
  pvpbotrlexample.host:
    default: true
  pvpbotrlexample.spectate:
    default: true
  pvpbotrlexample.admin:
    default: op
