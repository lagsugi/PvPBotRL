name: PvPBotRLExample
version: '1.0.0'
main: dev.sugi.pvpbot.example.ExamplePlugin
api-version: '26.1.2'
depend: [PvPBotRL]
commands:
  rlbotexample:
    description: Play a sword duel against a PvPBotRL opponent.
    usage: /rlbotexample [start [model]|rematch|leave|list|status|recover|pause|resume]
    permission: pvpbotrlexample.demo
permissions:
  pvpbotrlexample.demo:
    default: true
  pvpbotrlexample.admin:
    default: op
