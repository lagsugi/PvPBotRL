menu_title: '&8Arena Management'
size: 54
update_interval: 1
args:
  - session
items:
  selected:
    material: BRICKS
    slot: 4
    display_name: '&eSelected: %pvpbot_selected_arena%'
    update: true
  create:
    material: STONE
    slot: 19
    display_name: '&aGenerate Arena'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} input create'
  register:
    material: WRITABLE_BOOK
    slot: 20
    display_name: '&aRegister Custom Arena'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} input register'
  info:
    material: PAPER
    slot: 21
    display_name: '&bArena Info'
