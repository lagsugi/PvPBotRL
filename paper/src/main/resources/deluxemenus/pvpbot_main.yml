menu_title: '&8PvPBot | Main Menu'
size: 54
update_interval: 1
args:
  - session
items:
  fight:
    material: DIAMOND_SWORD
    slot: 11
    display_name: '&aFight a Bot'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav fight'
  bots:
    material: IRON_SWORD
    slot: 13
    display_name: '&aBot vs Bot'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav bots'
  challenge:
    material: PLAYER_HEAD
    slot: 15
    display_name: '&aChallenge a Player'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav challenge'
  invites:
    material: PAPER
    slot: 20
    display_name: '&eInvitations'
    lore:
      - '&7Pending: %pvpbot_invite_count%'
    update: true
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav invitations'
  queue:
    material: CLOCK
    slot: 22
    display_name: '&eMatchmaking'
    lore:
      - '&7Players waiting: %pvpbot_queue_size%'
    update: true
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav queue'
  live:
    material: SPYGLASS
    slot: 24
    display_name: '&bLive Matches'
    lore:
      - '&7Live: %pvpbot_live_count%'
    update: true
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav live'
  current:
    material: HEART_OF_THE_SEA
    slot: 29
    display_name: '&bCurrent Match'
    lore:
      - '&7State: %pvpbot_state%'
    update: true
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} current'
  spectate:
    material: ENDER_EYE
    slot: 31
    display_name: '&bSpectator Controls'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav spectator'
  arenas:
    material: BRICKS
    slot: 33
    display_name: '&6Arena Management'
    view_requirement:
      requirements:
        permission:
          type: has permission
          permission: pvpbot.admin
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav arenas'
  rematch:
    material: TOTEM_OF_UNDYING
    slot: 38
    display_name: '&eRematch'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} rematch'
  leave:
    material: OAK_DOOR
    slot: 42
    display_name: '&cLeave Match or Spectating'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} leave'
  help:
    material: BOOK
    slot: 47
    display_name: '&bCommand Help'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} help'
  recover:
    material: CHEST
    slot: 51
    display_name: '&eRecover Original State'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} recover'
