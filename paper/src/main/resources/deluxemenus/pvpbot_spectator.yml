menu_title: '&8Spectator Controls'
size: 36
update_interval: 1
args:
  - session
items:
  status:
    material: HEART_OF_THE_SEA
    slot: 4
    display_name: '&e%pvpbot_state% | %pvpbot_camera%'
    lore:
      - '&7A: %pvpbot_match_a_name% %pvpbot_match_a_hp% / %pvpbot_match_a_max_hp% HP'
      - '&7B: %pvpbot_match_b_name% %pvpbot_match_b_hp% / %pvpbot_match_b_max_hp% HP'
    update: true
  free:
    material: FEATHER
    slot: 11
    display_name: '&aFree View'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} free'
  a:
    material: DIAMOND_SWORD
    slot: 13
    display_name: '&bWatch Fighter A'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} a'
  b:
    material: IRON_SWORD
    slot: 15
    display_name: '&bWatch Fighter B'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} b'
  current:
    material: PAPER
    slot: 21
    display_name: '&bMatch Details'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} current'
  leave:
    material: OAK_DOOR
    slot: 23
    display_name: '&cLeave Spectating'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} leave'
  back:
    material: OAK_DOOR
    slot: 27
    display_name: '&7Main Menu'
    left_click_commands:
      - '[player] pvpbot:pvpbot ui {session} nav main'
